name: 1yongcloud
description: >-
  Beijing Yiyong Technology Co., Ltd. (北京壹永科技有限公司 / 1yongcloud), founded in
  October 2017, is a Chinese oncology big-data and artificial-intelligence
  company. It builds medical-data collection, quality-control and governance
  capabilities and healthcare information products for hospitals and government
  health programs. Its product lines include a tumor diagnosis-and-treatment
  standardization and cost-rationalization platform, a hospital cancer
  opportunistic-screening platform, an integrated clinical-research platform,
  and a smart-hospital comprehensive operations decision platform. The company
  is backed by investors including Qiming Venture Partners, Sequoia Capital
  China, and Cathay Capital. It operates no public developer portal, API, or
  SDK; this profile tracks 1yongcloud as a company in the API Evangelist network.
